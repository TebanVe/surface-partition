# ============================================================================
# ADAPTIVE COARSE-ONLY WTA SCHEDULE -- N=200 deliverable run, GOOD-SEED reseed.
# docs/plans/PHASE1_COARSE_ONLY_WTA_SCHEDULE.md (adaptive, gate-conditioned switch).
#
# WHY THIS CONFIG EXISTS. The prior adaptive run on the BAD seed 84172851
# (parameters/torus_200part_coarse_seeded_lam9_adaptive.yaml, run_20260722_121925)
# produced 3 DISCONNECTED cells (58, 168, 17): their winner-take-all territory
# split into 2-4 islands. Diagnosis (docs/reference/winner_take_all_partition_gap.md
# Manifestation C): those exact cells were already broken at seed 84172851 on the
# OLD energy -- undersized "runts" (17: -34%, 58: -24%) -- so it is a seed
# pathology, not a flaw in the balance term. The term fixed their AREA but, at that
# seed, could only assemble a fair area out of disconnected pieces (it enforces
# total area, not connectivity), converting each runt into a split.
#
# THE FIX = RESEED. seed 61803399 is PROVEN clean at N=200 on this exact 5-level
# fine mesh: the shared downstream deliverable (run_20260722_175451, term OFF,
# lam11) has 0 dead / 0 imbalanced / 0 fragmented cells (17/58/168 all single
# connected blobs, worst area dev 1.7%). This config re-runs that good seed with
# the adaptive territory-aware machinery on, so the branch's pipeline produces a
# clean, connected, balanced fine-mesh partition -- and the new connectivity gate
# (detect_disconnected_cells) will auto-flag any residual split.
#
# lambda_penalty = 11.0 matches the proven-clean seed-61803399 run (NOT 9.0, which
# was tuned for the other seed). seed and lambda are the ONLY changes vs the bad-
# seed adaptive config; the schedule, mesh ladder, and machinery are identical.
#
# THE SCHEDULE (wta_schedule: adaptive). The full territory-aware machinery (WTA
# balance term + discrete trim + P2 reduced gradient) runs only WHILE the winner-
# take-all structure is not yet correct; once a level ends with worst|dev| <
# switch_margin it hands off to the cheap original energy E0 for the finer levels,
# and re-arms if a cheap level drifts back over rearm_threshold. detect_area_imbalance
# drives the switch after each level (logged). The switch level rises with N
# automatically -- do NOT hardcode it. On this good seed the switch should fire
# EARLIER than on the bad seed (less entrenched imbalance to clear).
#
# TRIGGERS. While the machinery is active the trim's retarget sawtooth removes the
# energy plateau, so refinement fires on projected stationarity ||g_t|| + feasibility
# (the balance-plateau trigger); the cheap levels use the normal energy-plateau trigger.
#
# SUCCESS = final metadata.yaml with n_imbalanced: 0 (worst < 5%) AND
# n_fragmented: 0 (no disconnected cells) on the >100k mesh.
# ============================================================================

experiment:
  name: torus-200-coarse-seeded-s61803399-lam11-adaptive
  surface: torus

relaxation:
  n_partitions: 200
  lambda_penalty: 11.0                # matches the proven-clean seed-61803399 run
  seed: 61803399                      # PROVEN-CLEAN seed (reseed away from bad 84172851)
  init_method: seeded                 # mandatory at high N
  max_iter: 30000                     # a cap; the balance-plateau trigger should fire earlier
  refinement_levels: 5                # FINE deliverable: 100x96 ... 348x328 (V=114,144)
  use_analytic: true
  use_discrete_area_for_constraints: true

  # --- Adaptive territory-aware schedule (identical to the bad-seed adaptive config) ---
  wta_schedule: adaptive              # gate-conditioned: expensive only until structure is correct
  wta_switch_margin: 0.03             # expensive -> cheap once worst|dev| < 3% (headroom under the 5% gate)
  wta_rearm_threshold: 0.05           # cheap -> expensive if a cheap level ends over the 5% gate
  # Machinery definition (used only while active):
  wta_balance_gamma: 7.0              # calibrated once; NOT retuned per N
  wta_balance_power: 2.0             # p=2 (docs/math/07-phase1-wta-balance)
  wta_trim_period: 200               # every 200 accepted iters
  wta_trim_damping: 0.5
  wta_trim_clamp: 0.20               # targets clamped to Abar +/- 20%
  pgd_dual_sweeps: 8                 # Gauss-Seidel dual sweeps per step

  pgd_step0: 1.0
  pgd_armijo_c: 0.0001
  pgd_backtrack_rho: 0.5
  pgd_projection_max_iter: 300
  pgd_projection_tol: 1.0e-8

  enable_refinement_triggers: true
  refine_trigger_mode: full
  refine_patience: 30
  refine_delta_energy: 1.0e-8
  refine_grad_tol: 1.0e-2
  refine_constraint_tol: 1.0e-2
  refine_gnorm_patience: 30
  refine_gnorm_delta: 1.0e-4
  refine_feas_patience: 30
  refine_feas_delta: 1.0e-6

  penalty_target_mode: fixed
  penalty_eps: 1.0e-8

  run_log_frequency: 500
  h5_save_stride: 500
  h5_save_vars: ["x"]
  h5_always_save_first_last: true
  profile: true

surface:
  torus:
    n_theta: 100                      # levels: 100x96, 162x154, 224x212, 286x270, 348x328
    n_phi: 96
    R: 1.0
    r: 0.6
    n_theta_increment: 62
    n_phi_increment: 58

refinement:
  method: ipopt
  max_iterations: 19
  max_opt_iter: 200
  tolerance: 1.0e-7
  boundary_tol: 0.001
  lbfgs_memory: 30
  exact_hessian: true
  best_iterate: true
  allow_partial_convergence: true
  save_iterations: true
  distance_preservation: preserve
