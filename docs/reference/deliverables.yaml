# Exported partitions — the record of every file downstream repos consume.
#
# THIS FILE IS THE RECORD; the .h5 files are the artefacts. Verify one against
# the other with:
#
#     python scripts/check_deliverables.py
#
# and regenerate the rows from disk with `--emit`. `results/` is gitignored and
# each git worktree holds its own runs, so a row whose file is absent in a given
# checkout is reported and skipped, never deleted.
#
# Every field below is read straight off the exported file. Phase 1 quality
# figures (worst-cell discrete imbalance, fragmentation) are deliberately NOT
# here: they belong to the run, not the deliverable, and live in the run's
# `arm_report.yaml` (approach B) or `solution/metadata.yaml` (PGD).
#
# `finalised: true` is what downstream gates on. Every high-N export needed
# `--force-finalised`, because the Phase 2 migration-cycling plateau leaves
# `pending_migration=True` on the best iterate.
#
# ⚠ Perimeter is `sum_k Per(cell_k)`, so every interface is counted TWICE. A
# consumer wanting total interface length must halve it.
#
# GROUPS
#   common-mesh      torus, V=114,144 — USE THESE for any cross-N study
#   finer-mesh       torus, better partitions but NOT cross-comparable
#   mc-study         the downstream Monte-Carlo set (groups A/B/C)
#   implicit-surface schema 2.0, general-surface exporter (0035dde)
#   legacy-smoke     finalised=false; not deliverables
#
# ⚠ Choosing the common mesh costs two measured things, both small: a coarser
# mesh UNDER-measures perimeter (N=1000 reads 583.1417 against 583.2558 on its
# own finer mesh, -0.020%, because a boundary of fewer longer segments is a
# shorter approximation), and exported equal-area accuracy is looser (0.0272% at
# N=750, 0.0127% at N=1000, against 0.0014-0.0023% at N=400/500).

